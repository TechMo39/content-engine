<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umma United Studio</title>
<style>
  :root{--ink:#0b1120;--bg:#0d1427;--navy:#111a33;--navy2:#1b2748;--cream:#f5efe1;--orange:#ff7a2f;--mute:#9fb6d8;--line:#22304f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--navy);border-bottom:1px solid var(--line);flex:0 0 auto}
  header .brand{font-family:Georgia,serif;font-size:19px;white-space:nowrap}
  header .brand .d{color:var(--orange)}
  .sp{flex:1}
  .btn{background:var(--navy2);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;font-family:inherit;font-size:13px}
  .btn:hover{border-color:var(--orange)}
  .btn.o{background:var(--orange);color:#1a1200;border-color:var(--orange);font-weight:700;padding:10px 20px}
  .btn.sm{padding:5px 10px;font-size:12px}
  .stat{font-size:12px;color:var(--mute);min-width:60px;text-align:right}
  .wrap{flex:1;overflow:auto;min-height:0;padding:24px;display:flex;justify-content:center}
  .panel{width:100%;max-width:680px}
  h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin:22px 0 6px}
  h2:first-child{margin-top:0}
  .sub{color:var(--mute);font-size:12.5px;margin:0 0 12px;line-height:1.5}
  textarea,select{width:100%;background:var(--navy);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;line-height:1.5;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:150px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .scenes{margin-top:14px}
  .scard{background:var(--navy);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:11px 13px;display:flex;align-items:center;gap:11px}
  .scard .n{width:22px;height:22px;border-radius:50%;background:var(--navy2);color:var(--cream);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .scard .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .scard .tech{flex:0 0 auto;font-size:11px;color:var(--orange);border:1px solid var(--orange);border-radius:20px;padding:2px 10px}
  .scard .au{color:var(--orange);font-size:12px;flex:0 0 auto}
  #log{background:#05080f;border:1px solid var(--line);border-radius:8px;padding:10px;height:110px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#bcd;white-space:pre-wrap;margin-top:18px}
  .empty{color:var(--mute);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:26px;text-align:center}
  a{color:#5fb6d8}
</style>
</head>
<body>
<header>
  <button class="btn sm" onclick="location.href='/'" title="terug naar Tale of Tiles">‹ Tiles</button>
  <div class="brand">Umma United <span class="d">·</span> Studio</div>
  <div class="sp"></div>
  <span class="stat" id="stat"></span>
  <button class="btn o" onclick="doRender()">Render video</button>
</header>

<div class="wrap">
 <div class="panel">

  <h2>Script</h2>
  <div class="sub">Plak het script dat Claude je gaf in de chat. De techniek per scène, de kaart en de stem zitten er al in.</div>
  <textarea id="script" spellcheck="false" placeholder="title: ...&#10;group belt = Morocco, Algeria, ...&#10;scene 1 | Islam was spread by the sword. | tech: mythe | truth: Look who's really pointing. | voice: assets/ummaunited/voice/sword/man/01.wav&#10;scene 2 | Rome. This is what forcing a faith looks like. | tech: kaart | rule: rome=ruler | view: mena | voice: ..."></textarea>
  <div style="margin-top:8px"><button class="btn o" onclick="loadScript()">Laad script</button></div>

  <div id="scenes" class="scenes"></div>

  <h2>Muziek (bodem)</h2>
  <div class="sub">De rustige basis onder de hele video. Claude zegt in de chat welke sfeer past.</div>
  <select id="music"><option value="">(geen)</option></select>

  <div id="log"></div>
 </div>
</div>

<script>
// De studio is nu kaal: script plakken -> stem+kaart+techniek zitten er al in -> renderen.
// Geen formulier, geen per-scène getweak (dat doet Claude in de chat). Alleen muziek kies je hier.
const COUNTRIES = {"Bulgaria":"100","Myanmar":"104","Burundi":"108","Belarus":"112","Cambodia":"116","Cameroon":"120","Canada":"124","Central African Rep.":"140","Sri Lanka":"144","Chad":"148","Chile":"152","China":"156","Taiwan":"158","Colombia":"170","Congo":"178","Dem. Rep. Congo":"180","Costa Rica":"188","Croatia":"191","Cuba":"192","Cyprus":"196","Czechia":"203","Benin":"204","Denmark":"208","Dominican Rep.":"214","Ecuador":"218","El Salvador":"222","Eq. Guinea":"226","Ethiopia":"231","Eritrea":"232","Estonia":"233","Falkland Is.":"238","Fiji":"242","Finland":"246","France":"250","Fr. S. Antarctic Lands":"260","Djibouti":"262","Gabon":"266","Georgia":"268","Gambia":"270","Palestine":"275","Germany":"276","Ghana":"288","Greece":"300","Greenland":"304","Guatemala":"320","Guinea":"324","Guyana":"328","Haiti":"332","Honduras":"340","Hungary":"348","Iceland":"352","India":"356","Indonesia":"360","Iran":"364","Iraq":"368","Ireland":"372","Israel":"376","Italy":"380","Côte d'Ivoire":"384","Jamaica":"388","Japan":"392","Kazakhstan":"398","Jordan":"400","Kenya":"404","North Korea":"408","South Korea":"410","Kuwait":"414","Kyrgyzstan":"417","Laos":"418","Lebanon":"422","Lesotho":"426","Latvia":"428","Liberia":"430","Libya":"434","Lithuania":"440","Luxembourg":"442","Madagascar":"450","Malawi":"454","Malaysia":"458","Mali":"466","Mauritania":"478","Mexico":"484","Mongolia":"496","Moldova":"498","Montenegro":"499","Morocco":"504","Mozambique":"508","Oman":"512","Namibia":"516","Nepal":"524","Netherlands":"528","New Caledonia":"540","Vanuatu":"548","New Zealand":"554","Nicaragua":"558","Niger":"562","Nigeria":"566","Norway":"578","Pakistan":"586","Panama":"591","Papua New Guinea":"598","Paraguay":"600","Peru":"604","Philippines":"608","Poland":"616","Portugal":"620","Guinea-Bissau":"624","Timor-Leste":"626","Puerto Rico":"630","Qatar":"634","Romania":"642","Russia":"643","Rwanda":"646","Saudi Arabia":"682","Senegal":"686","Serbia":"688","Sierra Leone":"694","Slovakia":"703","Vietnam":"704","Slovenia":"705","Somalia":"706","South Africa":"710","Zimbabwe":"716","Spain":"724","S. Sudan":"728","Sudan":"729","W. Sahara":"732","Suriname":"740","eSwatini":"748","Sweden":"752","Switzerland":"756","Syria":"760","Tajikistan":"762","Thailand":"764","Togo":"768","Trinidad and Tobago":"780","United Arab Emirates":"784","Tunisia":"788","Turkey":"792","Turkmenistan":"795","Uganda":"800","Ukraine":"804","Macedonia":"807","Egypt":"818","United Kingdom":"826","Tanzania":"834","United States of America":"840","Burkina Faso":"854","Uruguay":"858","Uzbekistan":"860","Venezuela":"862","Yemen":"887","Zambia":"894","Argentina":"032","Bahamas":"044","Brazil":"076","Bolivia":"068","Belize":"084","Botswana":"072","Angola":"024","Algeria":"012","Bangladesh":"050","Bhutan":"064","Afghanistan":"004","Armenia":"051","Austria":"040","Albania":"008","Belgium":"056","Solomon Is.":"090","Australia":"036","Azerbaijan":"031","Brunei":"096","Antarctica":"010","Bosnia and Herz.":"070"};
const ALIASES = {uae:"United Arab Emirates",emirates:"United Arab Emirates",saudi:"Saudi Arabia",ksa:"Saudi Arabia",bosnia:"Bosnia and Herz.",turkiye:"Turkey","türkiye":"Turkey",usa:"United States of America",uk:"United Kingdom"};
const COLORS = {orange:"#ff7a2f",red:"#c0392b",ruler:"#5fb6d8",green:"#2aa84a",blue:"#2756a0",cream:"#f5efe1"};

const state = { title:"", baseview:"belt", format:"9:16", music:"", groups:[], scenes:[] };
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/</g,'&lt;').replace(/"/g,'&quot;');
function logLine(t){const l=$('#log');l.textContent+=t+"\n";l.scrollTop=l.scrollHeight;}

// ---------- script laden (Claude's output uit de chat) ----------
function parseScript(text){
  const out={title:null,view:null,groups:[],scenes:[]};
  for(const raw of String(text).split(/\r?\n/)){
    const line=raw.trim(); if(!line||line.startsWith('#'))continue;
    if(/^title\s*:/i.test(line)){out.title=line.replace(/^title\s*:/i,'').trim();continue;}
    if(/^view\s*:/i.test(line)){out.view=line.replace(/^view\s*:/i,'').trim();continue;}
    const m=line.match(/^group\s+([^=]+)=(.*)$/i);
    if(m){out.groups.push({name:m[1].trim(),countries:m[2].trim()});continue;}
    if(/^scene\s+/i.test(line)){
      const segs=line.replace(/^scene\s+/i,'').split('|').map(s=>s.trim());
      const sc={tech:'kaart',year:segs[0]||'',text:segs[1]||'',fills:[],rule:[],view:out.view||'belt',dur:0,voice:'',sfx:'',truth:'',kick:''};
      for(let k=2;k<segs.length;k++){const seg=segs[k];const ci=seg.indexOf(':');if(ci<0)continue;
        const key=seg.slice(0,ci).trim().toLowerCase();const val=seg.slice(ci+1).trim();
        if(key==='fill'||key==='rule'){for(const pr of val.split(';')){const eq=pr.indexOf('=');if(eq<0)continue;const g=pr.slice(0,eq).trim();const c=pr.slice(eq+1).trim();if(g&&c)(key==='fill'?sc.fills:sc.rule).push({g,c});}}
        else if(key==='view')sc.view=val;
        else if(key==='dur'){const d=parseFloat(val);if(d>0)sc.dur=d;}
        else if(key==='tech'||key==='techniek'||key==='technique')sc.tech=val.toLowerCase();
        else if(key==='truth')sc.truth=val;
        else if(key==='kick')sc.kick=val;
        else if(key==='voice')sc.voice=val;
        else if(key==='sfx')sc.sfx=val;
      }
      out.scenes.push(sc);
    }
  }
  return out;
}
function loadScript(){
  const p=parseScript($('#script').value);
  if(!p.scenes.length){ logLine('geen scènes gevonden — plak het script dat Claude gaf.'); return; }
  state.title=p.title||''; if(p.view)state.baseview=p.view;
  state.groups=p.groups; state.scenes=p.scenes;
  renderScenes();
  logLine('✓ script geladen: '+p.scenes.length+' scènes, '+p.groups.length+' groepen');
}
function renderScenes(){
  const el=$('#scenes');
  if(!state.scenes.length){ el.innerHTML='<div class="empty">Nog geen script geladen. Plak Claude\'s script hierboven en klik <b>Laad script</b>.</div>'; return; }
  el.innerHTML=state.scenes.map((s,i)=>{
    const au=(s.voice||s.sfx)?'<span class="au">♪</span>':'';
    return `<div class="scard"><span class="n">${i+1}</span><span class="tx">${esc(s.text||'(geen tekst)')}</span>${au}<span class="tech">${esc(s.tech||'kaart')}</span></div>`;
  }).join('');
}

// ---------- render ----------
function resolveCountry(tok){ tok=tok.trim(); if(!tok)return null; if(/^\d+$/.test(tok))return tok; if(COUNTRIES[tok])return COUNTRIES[tok];
  const hit=Object.keys(COUNTRIES).find(n=>n.toLowerCase()===tok.toLowerCase()); if(hit)return COUNTRIES[hit];
  const al=ALIASES[tok.toLowerCase()]; if(al&&COUNTRIES[al])return COUNTRIES[al]; return null; }
function buildOpts(warn){
  const groups={};
  for(const g of state.groups){ if(!g.name)continue; const ids=[]; for(const part of g.countries.split(',')){ const id=resolveCountry(part); if(id)ids.push(id); else if(part.trim())warn('land niet gevonden: '+part.trim()+' (groep '+g.name+')'); } groups[g.name]=ids; }
  const scenes=state.scenes.map(s=>{ const fills={},rule={}; for(const p of s.fills){if(p.g&&COLORS[p.c])fills[p.g]=COLORS[p.c];} for(const p of s.rule){if(p.g&&COLORS[p.c])rule[p.g]=COLORS[p.c];}
    const o={tech:s.tech||'kaart',year:s.year,text:s.text,fills,rule,view:s.view}; if(s.dur)o.dur=s.dur; if(s.voice)o.voice=s.voice; if(s.sfx)o.sfx=s.sfx; if(s.truth)o.truth=s.truth; if(s.kick)o.kick=s.kick; return o; });
  return {title:state.title, mapView:state.baseview, groups, scenes};
}
async function doRender(){
  if(!state.scenes.length){ logLine('geen script — plak en laad eerst een script.'); return; }
  const warnings=[]; const opts=buildOpts(w=>warnings.push(w));
  warnings.forEach(w=>logLine('LET OP: '+w));
  logLine('▶ render gestart...'); $('#stat').textContent='rendert...';
  // GEEN template meegeven: de engine kiest zelf de compositie zodra een scène een tech-veld heeft.
  try{ const r=await fetch('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({brand:'ummaunited',format:state.format,music:state.music||'',opts})});
    const d=await r.json();
    if(d.error){logLine('✗ fout: '+d.error);$('#stat').textContent='fout';return;}
    logLine('✓ klaar: '+d.url+' — staat in je Bibliotheek.');$('#stat').textContent='klaar';
  }catch(e){logLine('✗ netwerkfout: '+e.message);$('#stat').textContent='fout';}
}

async function loadMusic(){ try{const r=await fetch('/api/music');const d=await r.json();
  $('#music').innerHTML='<option value="">(geen)</option>'+(d.files||[]).map(f=>'<option>'+f+'</option>').join('');
  $('#music').onchange=e=>state.music=e.target.value;
}catch{ $('#music').innerHTML='<option value="">(geen)</option>'; } }
function connectLog(){ try{const es=new EventSource('/api/log');es.onmessage=(e)=>{try{logLine(JSON.parse(e.data))}catch{logLine(e.data)}};}catch{} }

renderScenes(); loadMusic(); connectLog();
</script>
</body>
</html>
